<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature's Tic Tac Toe - Mental Health Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #22c55e;
            --primary-dark: #16a34a;
            --primary-light: #86efac;
            --background: #0f172a;
            --surface: #1e293b;
            --text: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--background);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            background-image: linear-gradient(rgba(15, 23, 42, 0.3), rgba(15, 23, 42, 0.4)), 
                              url('https://images.unsplash.com/photo-1523712999610-f77fbcfc3843?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=85');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .container {
            background: rgba(30, 41, 59, 0.7);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            position: relative;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .controls {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .select {
            background: var(--background);
            color: var(--text);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 0.5rem 0.75rem;
            border-radius: 0.5rem;
            font-family: 'Poppins', sans-serif;
        }

        .back-btn {
            position: absolute;
            top: 1rem;
            left: 1rem;
            background: var(--primary);
            color: var(--text);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .sound-control {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: var(--primary);
            color: var(--text);
            border: none;
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .sound-control:hover {
            background: var(--primary-dark);
            transform: scale(1.1);
        }

        .game-title {
            text-align: center;
            color: var(--primary);
            font-size: clamp(1.5rem, 4vw, 2rem);
            margin-bottom: 2rem;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .players {
            display: flex;
            justify-content: space-around;
            margin-bottom: 2rem;
            gap: 1rem;
        }

        .player-card {
            background: var(--background);
            padding: 1rem;
            border-radius: 0.5rem;
            text-align: center;
            flex: 1;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .player-card.active {
            border: 2px solid var(--primary);
            transform: translateY(-4px);
        }

        .player-symbol {
            width: 2rem;
            height: 2rem;
            margin-bottom: 0.5rem;
        }

        .player-name {
            color: var(--text);
            font-size: clamp(0.875rem, 2vw, 1rem);
            margin-bottom: 0.25rem;
        }

        .player-score {
            color: var(--primary);
            font-size: clamp(1.25rem, 3vw, 1.5rem);
            font-weight: 600;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            margin-bottom: 2rem;
            aspect-ratio: 1;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .cell {
            background: var(--background);
            border: none;
            border-radius: 0.5rem;
            aspect-ratio: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .cell:hover:not(.filled) {
            background: var(--primary-dark);
            transform: scale(0.95);
        }

        .cell.filled {
            cursor: not-allowed;
        }

        .cell.winner {
            background: var(--primary);
        }

        .symbol {
            width: 60%;
            height: 60%;
            position: relative;
            animation: symbolAppear 0.3s ease-out;
        }

        @keyframes symbolAppear {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .status {
            text-align: center;
            color: var(--text);
            font-size: clamp(1rem, 2.5vw, 1.25rem);
            margin-bottom: 1.5rem;
            min-height: 1.5em;
            font-weight: 500;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }

        .reset-btn {
            background: var(--primary);
            color: var(--text);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            font-size: clamp(0.875rem, 2vw, 1rem);
            display: block;
            margin: 0 auto;
            transition: all 0.3s ease;
        }

        .reset-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        @media (max-width: 480px) {
            .container {
                padding: 1.5rem;
            }

            .game-board {
                gap: 0.25rem;
            }

            .cell {
                border-radius: 0.25rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="back-btn" onclick="window.location.href='/games'">
            ← Back
        </button>
        <button class="sound-control" id="soundToggle" aria-label="Toggle sound">
            🔊
        </button>
        <h1 class="game-title">Nature's Tic Tac Toe</h1>
        <div class="controls" aria-label="Game settings">
            <select class="select" id="roleSelect" aria-label="Choose your symbol">
                <option value="leaf" selected>Play as Leaf (X)</option>
                <option value="twig">Play as Twig (O)</option>
            </select>
            <select class="select" id="difficultySelect" aria-label="Choose difficulty">
                <option value="easy">Easy</option>
                <option value="medium" selected>Medium</option>
                <option value="hard">Hard</option>
            </select>
            <select class="select" id="startSelect" aria-label="Who starts">
                <option value="player" selected>Player starts</option>
                <option value="ai">AI starts</option>
                <option value="random">Random</option>
            </select>
        </div>
        <div class="players">
            <div class="player-card" id="leafPlayer">
                <svg class="player-symbol" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M17,8C8,10 5.9,16.17 3.82,21.34L5.71,22L6.66,19.7C7.14,19.87 7.64,20 8,20C19,20 22,3 22,3C21,5 14,5.25 9,6.25C4,7.25 2,11.5 2,13.5C2,15.5 3.75,17.25 3.75,17.25C7,8 17,8 17,8Z"/>
                </svg>
                <div class="player-name">Leaf</div>
                <div class="player-score" id="leafScore">0</div>
            </div>
            <div class="player-card" id="twigPlayer">
                <svg class="player-symbol" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12,2L4,12L12,22L20,12L12,2M12,4.5L17.5,12L12,19.5L6.5,12L12,4.5Z"/>
                </svg>
                <div class="player-name">Twig</div>
                <div class="player-score" id="twigScore">0</div>
            </div>
        </div>
        <div class="game-board" id="board" role="grid" aria-label="Tic Tac Toe game board">
            <button class="cell" role="gridcell" aria-label="Cell 1" data-index="0"></button>
            <button class="cell" role="gridcell" aria-label="Cell 2" data-index="1"></button>
            <button class="cell" role="gridcell" aria-label="Cell 3" data-index="2"></button>
            <button class="cell" role="gridcell" aria-label="Cell 4" data-index="3"></button>
            <button class="cell" role="gridcell" aria-label="Cell 5" data-index="4"></button>
            <button class="cell" role="gridcell" aria-label="Cell 6" data-index="5"></button>
            <button class="cell" role="gridcell" aria-label="Cell 7" data-index="6"></button>
            <button class="cell" role="gridcell" aria-label="Cell 8" data-index="7"></button>
            <button class="cell" role="gridcell" aria-label="Cell 9" data-index="8"></button>
        </div>
        <div class="status" id="status" role="status" aria-live="polite">Leaf's turn</div>
        <button class="reset-btn" id="resetBtn" type="button" onclick="resetGame();" aria-label="Reset game">New Game</button>
    </div>

    <script>
        // Game state
        let currentPlayer = 'leaf';
        let gameState = ['', '', '', '', '', '', '', '', ''];
        let gameActive = true;
        let gameStartTime = Date.now();
        let soundEnabled = true;
        let isAiTurn = false;
        let playerSymbol = 'leaf';
        let aiSymbol = 'twig';
        let difficulty = 'medium'; // easy | medium | hard
        let startOption = 'player'; // player | ai | random

        // Sound effects
        const sounds = {
            // Use existing audio assets to avoid 404s
            place: new Audio("{{ url_for('static', filename='audio/focus/focus1.mp3') }}"),
            win: new Audio("{{ url_for('static', filename='audio/energetic/energetic1.mp3') }}"),
            draw: new Audio("{{ url_for('static', filename='audio/calm/calm1.mp3') }}")
        };

        // Winning combinations
        const winningCombos = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
            [0, 4, 8], [2, 4, 6] // Diagonals
        ];

        // Player symbols
        const symbols = {
            leaf: `<svg class="symbol" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M17,8C8,10 5.9,16.17 3.82,21.34L5.71,22L6.66,19.7C7.14,19.87 7.64,20 8,20C19,20 22,3 22,3C21,5 14,5.25 9,6.25C4,7.25 2,11.5 2,13.5C2,15.5 3.75,17.25 3.75,17.25C7,8 17,8 17,8Z"/>
                </svg>`,
            twig: `<svg class="symbol" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12,2L4,12L12,22L20,12L12,2M12,4.5L17.5,12L12,19.5L6.5,12L12,4.5Z"/>
                </svg>`
        };

        // Handle cell click (Human move)
        function handleCellClick(e) {
            if (isAiTurn) return;
            const cell = e.target;
            const index = parseInt(cell.getAttribute('data-index'));

            if (gameState[index] !== '' || !gameActive) return;

            // Human move
            if (currentPlayer !== playerSymbol) return; // prevent playing when it's AI's turn
            gameState[index] = playerSymbol;
            cell.innerHTML = symbols[playerSymbol];
            cell.classList.add('filled');
            
            if (soundEnabled) {
                sounds.place.play();
            }

            // Check outcome
            const outcome = evaluateBoard();
            if (outcome) return;

            // Switch to AI turn
            isAiTurn = true;
            currentPlayer = aiSymbol;
            updateTurnStatus();
            setTimeout(aiMove, 450);
        }

        // Check for win or draw (no automatic turn change)
        function checkResultOnly() {
            let winningCombo = null;
            for (const combo of winningCombos) {
                const [a, b, c] = combo;
                if (gameState[a] && gameState[a] === gameState[b] && gameState[a] === gameState[c]) {
                    winningCombo = combo;
                    break;
                }
            }
            if (winningCombo) {
                endGame('win', winningCombo);
                return 'win';
            }
            if (!gameState.includes('')) {
                endGame('draw');
                return 'draw';
            }
            return null;
        }

        // Evaluate board and end game if needed
        function evaluateBoard() {
            const result = checkResultOnly();
            if (result) {
                return true;
            }
            return false;
        }

        // End the game
        function endGame(result, winningCombo = null) {
            gameActive = false;
            const duration = Math.round((Date.now() - gameStartTime) / 1000);
            const moves = gameState.filter(cell => cell !== '').length;

            if (winningCombo) {
                winningCombo.forEach(index => {
                    document.querySelector(`[data-index="${index}"]`).classList.add('winner');
                });
            }

            if (soundEnabled) {
                sounds[result].play();
            }

            let message = '';
            if (result === 'win') {
                // Determine winner from last mover
                const winner = currentPlayer === 'leaf' ? 'Leaf' : 'Twig';
                message = `${winner} wins!`;
                updateScore(currentPlayer);
            } else {
                message = "It's a draw!";
            }

            document.getElementById('status').textContent = message;
            saveGameStats(result === 'win' ? currentPlayer : 'draw', moves, duration);
        }

        // Update UI to reflect whose turn
        function updateTurnStatus() {
            document.getElementById('status').textContent = `${currentPlayer === 'leaf' ? 'Leaf' : 'Twig'}'s turn`;
            const leafCard = document.getElementById('leafPlayer');
            const twigCard = document.getElementById('twigPlayer');
            if (currentPlayer === 'leaf') {
                leafCard.classList.add('active');
                twigCard.classList.remove('active');
            } else {
                leafCard.classList.remove('active');
                twigCard.classList.add('active');
            }
        }

        // AI move (Twig)
        function aiMove() {
            if (!gameActive) return;
            const index = bestAIMove(aiSymbol, playerSymbol);
            if (index === null || gameState[index] !== '') {
                // Fallback: pick first available
                const avail = getAvailableIndices(gameState);
                if (avail.length === 0) return;
                placeAIMove(avail[0]);
            } else {
                placeAIMove(index);
            }

            // Check outcome
            const outcome = evaluateBoard();
            if (outcome) return;

            // Back to human
            currentPlayer = playerSymbol;
            isAiTurn = false;
            updateTurnStatus();
        }

        function placeAIMove(index) {
            const cell = document.querySelector(`[data-index="${index}"]`);
            gameState[index] = aiSymbol;
            cell.innerHTML = symbols[aiSymbol];
            cell.classList.add('filled');
            if (soundEnabled) {
                sounds.place.play();
            }
        }

        function getAvailableIndices(state) {
            const res = [];
            for (let i = 0; i < state.length; i++) {
                if (state[i] === '') res.push(i);
            }
            return res;
        }

        function isWinningState(state, player) {
            for (const [a, b, c] of winningCombos) {
                if (state[a] === player && state[b] === player && state[c] === player) return true;
            }
            return false;
        }

        // AI selection based on difficulty
        function bestAIMove(ai, human) {
            const avail = getAvailableIndices(gameState);
            if (avail.length === 0) return null;

            if (difficulty === 'easy') {
                return avail[Math.floor(Math.random() * avail.length)];
            }

            if (difficulty === 'medium') {
                // Heuristic: win > block > center > corner > side
                // 1) Can AI win now?
                for (const idx of avail) {
                    const tmp = gameState.slice();
                    tmp[idx] = ai;
                    if (isWinningState(tmp, ai)) return idx;
                }
                // 2) Block human win
                for (const idx of avail) {
                    const tmp = gameState.slice();
                    tmp[idx] = human;
                    if (isWinningState(tmp, human)) return idx;
                }
                // 3) Center
                if (avail.includes(4)) return 4;
                // 4) Corner
                const corners = [0, 2, 6, 8].filter(i => avail.includes(i));
                if (corners.length) return corners[Math.floor(Math.random() * corners.length)];
                // 5) Any side
                return avail[Math.floor(Math.random() * avail.length)];
            }

            // Hard: minimax optimal
            let bestScore = -Infinity;
            let move = avail[0];
            for (const idx of avail) {
                const tmp = gameState.slice();
                tmp[idx] = ai;
                const score = minimax(tmp, false, ai, human);
                if (score > bestScore) {
                    bestScore = score;
                    move = idx;
                }
            }
            return move;
        }

        function minimax(state, isMax, ai, human) {
            if (isWinningState(state, ai)) return 10;
            if (isWinningState(state, human)) return -10;
            const avail = getAvailableIndices(state);
            if (avail.length === 0) return 0;

            if (isMax) {
                let best = -Infinity;
                for (const idx of avail) {
                    const tmp = state.slice();
                    tmp[idx] = ai;
                    best = Math.max(best, minimax(tmp, false, ai, human));
                }
                return best;
            } else {
                let best = Infinity;
                for (const idx of avail) {
                    const tmp = state.slice();
                    tmp[idx] = human;
                    best = Math.min(best, minimax(tmp, true, ai, human));
                }
                return best;
            }
        }

        // Reset the game
        function resetGame() {
            gameState = ['', '', '', '', '', '', '', '', ''];
            gameActive = true;
            gameStartTime = Date.now();
            // Apply current settings
            aiSymbol = playerSymbol === 'leaf' ? 'twig' : 'leaf';
            // Determine who starts
            const starter = startOption === 'random' ? (Math.random() < 0.5 ? 'player' : 'ai') : startOption;
            currentPlayer = starter === 'player' ? playerSymbol : aiSymbol;
            isAiTurn = starter === 'ai';
            
            document.querySelectorAll('.cell').forEach(cell => {
                cell.innerHTML = '';
                cell.classList.remove('filled', 'winner');
            });
            
            updateTurnStatus();
            // If AI starts, make first move after short delay
            if (isAiTurn) setTimeout(aiMove, 450);
        }

        // Update player score
        function updateScore(player) {
            const scoreElement = document.getElementById(`${player}Score`);
            scoreElement.textContent = parseInt(scoreElement.textContent) + 1;
        }

        // Save game statistics
        async function saveGameStats(winner, moves, duration) {
            try {
                const response = await fetch('/api/save-ttt-game', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        winner,
                        moves,
                        duration
                    })
                });

                if (!response.ok) {
                    throw new Error('Failed to save game statistics');
                }
            } catch (error) {
                console.error('Error saving game statistics:', error);
            }
        }

        // Toggle sound
        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundToggle').textContent = soundEnabled ? '🔊' : '🔇';
        }

        // Event listeners
        document.querySelectorAll('.cell').forEach(cell => {
            cell.addEventListener('click', handleCellClick);
        });

        document.getElementById('resetBtn').addEventListener('click', resetGame);
        document.getElementById('soundToggle').addEventListener('click', toggleSound);

        // Settings handlers
        document.getElementById('roleSelect').addEventListener('change', (e) => {
            playerSymbol = e.target.value;
            aiSymbol = playerSymbol === 'leaf' ? 'twig' : 'leaf';
            // Reset to apply role change
            resetGame();
        });
        document.getElementById('difficultySelect').addEventListener('change', (e) => {
            difficulty = e.target.value;
        });
        document.getElementById('startSelect').addEventListener('change', (e) => {
            startOption = e.target.value;
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (!gameActive || isAiTurn) return;
            const key = e.key;
            if (key >= '1' && key <= '9') {
                const index = key - 1;
                const cell = document.querySelector(`[data-index="${index}"]`);
                if (cell && !cell.classList.contains('filled')) {
                    cell.click();
                }
            }
        });

        // Initialize game
        // Defaults
        playerSymbol = 'leaf';
        aiSymbol = 'twig';
        difficulty = 'medium';
        startOption = 'player';
        resetGame();
    </script>
</body>
</html>
